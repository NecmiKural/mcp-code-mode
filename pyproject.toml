[project]
name = "mcp-code-mode"
version = "0.1.0"
description = "Run model-written Python against any MCP server's tools, in a locked-down Docker sandbox, through a host-side bridge that checks every call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Necmi Kural" }]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26",
    "mcp>=2.3,<3",
]

[project.scripts]
mcp-code-mode = "mcp_code_mode.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
